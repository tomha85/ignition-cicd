name: Ignition EAM E2E TEST
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "validate only or stage project on TEST Controller (EAM remains HOLD)"
        required: true
        type: choice
        options: [validate, stage-controller]
        default: validate
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and configuration
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py ignition-project/DeploymentSmokeTest
          python scripts/stage_controller.py --check-config
  stage-controller:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'stage-controller' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    concurrency:
      group: ignition-eam-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage TEST project, with backup; NEVER invoke EAM
        env:
          IGNITION_LAB_ONLY: 'YES'
          IGNITION_CONTROLLER_CONTAINER: ${{ vars.IGNITION_CONTROLLER_CONTAINER }}
          IGNITION_AGENT_CONTAINER: ${{ vars.IGNITION_AGENT_CONTAINER }}
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/stage_controller.py --stage
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ignition-controller-staging-evidence
          path: evidence/controller-stage.json
          if-no-files-found: warn
