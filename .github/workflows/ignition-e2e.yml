name: Ignition TEST - Validate and One-Click Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy isolated Ignition TEST Agent (no production)'
        required: true
        type: choice
        options:
          - deploy-agent-direct
          - validate
        default: deploy-agent-direct

permissions:
  contents: read

jobs:
  validate:
    name: Validate native Perspective project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and project validation
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/validate.py ignition-project/DeploymentSmokeTest
          python scripts/stage_controller.py --check-config

  deploy-agent-direct:
    name: Backup, deploy, scan and verify TEST Agent
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'deploy-agent-direct' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feat/direct-agent-gitops-lab')
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    concurrency:
      group: ignition-test-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cross-browser runtime verification
        run: python -m pip install 'selenium>=4.20,<5'
      - name: Validate, backup, deploy, scan, verify, rollback on failure
        env:
          IGNITION_LAB_ONLY: 'YES'
          IGNITION_AGENT_CONTAINER: ${{ vars.IGNITION_AGENT_CONTAINER }}
          IGNITION_CONTROLLER_CONTAINER: ${{ vars.IGNITION_CONTROLLER_CONTAINER }}
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR }}
          IGNITION_AGENT_SCAN_URL: 'https://localhost:9243/data/api/v1/scan/projects'
          IGNITION_AGENT_CA_FILE: ${{ vars.IGNITION_AGENT_CA_FILE }}
          IGNITION_AGENT_GWBK: ${{ vars.IGNITION_AGENT_GWBK }}
          IGNITION_AGENT_API_TOKEN: ${{ secrets.IGNITION_AGENT_API_TOKEN }}
          IGNITION_E2E_BROWSER: ${{ vars.IGNITION_E2E_BROWSER || 'auto' }}
          no_proxy: 'localhost,127.0.0.1,::1'
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/direct_agent_lab.py
      - name: Upload TEST deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ignition-test-direct-evidence
          path: evidence/direct-agent.json
          if-no-files-found: warn
