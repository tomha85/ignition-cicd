name: Ignition EAM E2E TEST
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        description: "Choose Deploy TEST after PR is reviewed and merged into main"
        options: [validate, stage-controller, deploy-eam, deploy-agent-direct]
        default: deploy-agent-direct
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py ignition-project/DeploymentSmokeTest
          python scripts/stage_controller.py --check-config
  stage-controller:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'stage-controller' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    concurrency:
      group: ignition-eam-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage TEST Controller only
        env:
          IGNITION_LAB_ONLY: 'YES'
          IGNITION_CONTROLLER_CONTAINER: ${{ vars.IGNITION_CONTROLLER_CONTAINER }}
          IGNITION_AGENT_CONTAINER: ${{ vars.IGNITION_AGENT_CONTAINER }}
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/stage_controller.py --stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-controller-staging-evidence
          path: evidence/controller-stage.json
          if-no-files-found: warn
  deploy-eam:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-eam') ||
       (github.event_name == 'push' && vars.IGNITION_TEST_AUTO_DEPLOY == 'true'))
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    concurrency:
      group: ignition-eam-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Backup, stage, scan, gated EAM task and verify Agent files
        env:
          IGNITION_LAB_ONLY: 'YES'
          IGNITION_CONTROLLER_CONTAINER: ${{ vars.IGNITION_CONTROLLER_CONTAINER }}
          IGNITION_AGENT_CONTAINER: ${{ vars.IGNITION_AGENT_CONTAINER }}
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR }}
          IGNITION_GATEWAY_API_TOKEN: ${{ secrets.IGNITION_GATEWAY_API_TOKEN }}
          IGNITION_CONTROLLER_CA_FILE: /home/tomha/ignition-eam-lab/certs/lab-root-ca.crt
          IGNITION_CONTROLLER_RUNTIME_VERIFIED_SHA: ${{ vars.IGNITION_CONTROLLER_RUNTIME_VERIFIED_SHA }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/auto_eam_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-eam-automation-evidence
          path: evidence/auto-eam.json
          if-no-files-found: warn

  deploy-agent-direct:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'deploy-agent-direct' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    concurrency:
      group: ignition-eam-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime-verifier Python package
        run: python -m pip install 'selenium>=4.20,<5'
      - name: Direct TEST Agent preflight, backup, stage, scan and browser verification
        env:
          IGNITION_LAB_ONLY: 'YES'
          IGNITION_CONTROLLER_CONTAINER: ${{ vars.IGNITION_CONTROLLER_CONTAINER }}
          IGNITION_AGENT_CONTAINER: ${{ vars.IGNITION_AGENT_CONTAINER }}
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR }}
          IGNITION_AGENT_SCAN_URL: 'https://localhost:9243/data/api/v1/scan/projects'
          IGNITION_AGENT_CA_FILE: ${{ vars.IGNITION_AGENT_CA_FILE }}
          IGNITION_AGENT_API_TOKEN: ${{ secrets.IGNITION_AGENT_API_TOKEN }}
          IGNITION_AGENT_GWBK: ${{ vars.IGNITION_AGENT_GWBK }}
          IGNITION_E2E_BROWSER: ${{ vars.IGNITION_E2E_BROWSER || 'auto' }}
          NO_PROXY: 'localhost,127.0.0.1,::1'
          no_proxy: 'localhost,127.0.0.1,::1'
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/direct_agent_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-direct-agent-evidence
          path: evidence/direct-agent.json
          if-no-files-found: warn
