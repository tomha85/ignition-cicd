name: GitHub Actions Startup Health (No Deploy)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actions-startup-health:
    name: Confirm GitHub Actions runner is available
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert safe startup
        shell: bash
        run: |
          set -euo pipefail
          echo "ACTIONS_STARTUP=PASS"
          echo "IGNITION_DEPLOYMENT=NOT_REQUESTED"
