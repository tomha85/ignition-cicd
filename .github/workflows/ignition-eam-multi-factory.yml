name: Ignition EAM - Multi-Factory TEST

on:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Legacy EAM or new manual framework TEST action
        type: choice
        required: true
        options: [validate, framework-validate, framework-stage-controller]
        default: validate
      factory:
        description: Select legacy factory or framework factory
        type: choice
        required: true
        options: [factory_a, factory_b, factory_c, lab-warehouse, lab-assembly, lab-packaging]
        default: factory_a
      gateway_id:
        description: "Framework: Gateway ID (warehouse-main, assembly-main, utilities-main, packaging-main)"
        type: string
        required: false
        default: warehouse-main
      project_name:
        description: "Framework: project name from Gateway manifest"
        type: string
        required: false
        default: FactoryASmoke

permissions:
  contents: read

jobs:
  validate:
    name: Validate three isolated native Ignition projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/eam_multi_factory.py --validate
          for p in WarehouseHMI ConveyorHMI PackagingHMI; do
            python scripts/validate.py "ignition-project/$p"
          done
  plan-or-gated-deploy:
    name: Legacy factory plan — READ ONLY (Agent task is user-managed)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'validate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate legacy factory source without Gateway writes
        env:
          SELECTED_LEGACY_FACTORY: ${{ inputs.factory }}
        run: |
          python scripts/eam_multi_factory.py \
            --factory "$SELECTED_LEGACY_FACTORY" --sha "$GITHUB_SHA"

  reject-obsolete-deploy-actions:
    name: HOLD legacy write actions — use framework-stage-controller with approval
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'stage-controller' || inputs.action == 'deploy-test')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'HOLD: legacy direct Controller/Agent deployment is disabled in V3.' >&2
          echo 'Choose framework-stage-controller and approve the ignition-test environment.' >&2
          exit 2

  framework-validate:
    name: Validate manually selected factory, Gateway and TEST project
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'framework-validate' || inputs.action == 'framework-stage-controller')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only native project plan for selected TEST factory
        env:
          TARGET_FACTORY: ${{ inputs.factory }}
          TARGET_GATEWAY: ${{ inputs.gateway_id }}
          TARGET_PROJECT: ${{ inputs.project_name }}
        run: |
          python scripts/manual_factory_dispatch.py --action validate \
            --factory "$TARGET_FACTORY" \
            --gateway "$TARGET_GATEWAY" \
            --project "$TARGET_PROJECT" \
            --sha "$GITHUB_SHA"

  framework-stage-controller:
    name: Selected Factory - Backed-up TEST Controller staging (reusable V3)
    needs: [validate, framework-validate]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'framework-stage-controller' && github.ref == 'refs/heads/feat/reusable-multifactory-framework-v1'
    uses: ./.github/workflows/deploy-test.yml
    with:
      factory: ${{ inputs.factory }}
      gateway: ${{ inputs.gateway_id }}
      project: ${{ inputs.project_name }}
    secrets: inherit
