name: Ignition EAM - Multi-Factory TEST

on:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Legacy EAM or new manual framework TEST action
        type: choice
        required: true
        options: [validate, stage-controller, deploy-test, framework-validate, framework-stage-controller]
        default: validate
      factory:
        description: Select legacy factory or framework factory
        type: choice
        required: true
        options: [factory_a, factory_b, factory_c, lab-warehouse, lab-assembly]
        default: factory_a
      gateway_id:
        description: "Framework: Gateway ID (warehouse-main, assembly-main, utilities-main)"
        type: string
        required: false
        default: warehouse-main
      project_name:
        description: "Framework: project name from Gateway manifest"
        type: string
        required: false
        default: FactoryASmoke

permissions:
  contents: read

jobs:
  validate:
    name: Validate three isolated native Ignition projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/eam_multi_factory.py --validate
          for p in WarehouseHMI ConveyorHMI PackagingHMI; do
            python scripts/validate.py "ignition-project/$p"
          done
  plan-or-gated-deploy:
    name: Factory-specific EAM release request (fail closed)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'validate' || inputs.action == 'stage-controller' || inputs.action == 'deploy-test')
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    concurrency:
      group: eam-lab-${{ inputs.factory }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate target plan
        run: |
          python scripts/eam_multi_factory.py --factory "${{ inputs.factory }}" --sha "${{ github.sha }}"
      - name: Stage Factory A source on EAM Controller (backup first)
        if: inputs.action == 'stage-controller' && inputs.factory == 'factory_a'
        env:
          FACTORY_A_TEST_CONFIRM: 'YES'
        run: |
          bash scripts/stage_factory_a_controller_test.sh "$PWD"
      - name: Controller project scan after stage
        if: inputs.action == 'stage-controller' && inputs.factory == 'factory_a'
        env:
          IGNITION_CONTROLLER_API_TOKEN: ${{ secrets.IGNITION_GATEWAY_API_TOKEN }}
          IGNITION_CONTROLLER_CA_FILE: ${{ vars.IGNITION_CONTROLLER_CA_FILE || '/home/tomha/ignition-eam-lab/certs/lab-root-ca.crt' }}
        run: |
          python scripts/eam_controller_scan_test.py
      - name: Reject uncommissioned staging target
        if: inputs.action == 'stage-controller' && inputs.factory != 'factory_a'
        run: |
          echo "HOLD: only existing Factory A Controller staging is commissioned for this TEST" >&2
          exit 2
      - name: EAM TEST deployment (commissioned Controller bridge required)
        if: inputs.action == 'deploy-test'
        env:
          IGNITION_EAM_LAB_ONLY: 'YES'
          IGNITION_CONTROLLER_API_TOKEN: ${{ secrets.IGNITION_GATEWAY_API_TOKEN }}
          IGNITION_CONTROLLER_CA_FILE: ${{ vars.IGNITION_CONTROLLER_CA_FILE || '/home/tomha/ignition-eam-lab/certs/lab-root-ca.crt' }}
          IGNITION_EAM_BRIDGE_COMMISSIONED: ${{ vars.IGNITION_EAM_BRIDGE_COMMISSIONED || 'NO' }}
          IGNITION_EAM_CONTROLLER_CONTAINER: ${{ vars.IGNITION_CONTROLLER_CONTAINER }}
          IGNITION_EAM_AGENT_CONTAINER: ${{ inputs.factory == 'factory_a' && 'ignition-eam-agent' || inputs.factory == 'factory_b' && vars.IGNITION_FACTORY_B_CONTAINER || vars.IGNITION_FACTORY_C_CONTAINER }}
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR }}
        run: |
          python scripts/eam_multi_factory_deploy.py --factory "${{ inputs.factory }}" --sha "${{ github.sha }}"
      - name: Upload target-scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eam-multi-factory-evidence
          path: |
            evidence/eam-multi-factory.json
            evidence/eam-multi-factory-deploy.json
          if-no-files-found: warn

  framework-validate:
    name: Validate manually selected factory, Gateway and TEST project
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'framework-validate' || inputs.action == 'framework-stage-controller')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only native project plan for selected TEST factory
        env:
          TARGET_FACTORY: ${{ inputs.factory }}
          TARGET_GATEWAY: ${{ inputs.gateway_id }}
          TARGET_PROJECT: ${{ inputs.project_name }}
        run: |
          python scripts/manual_factory_dispatch.py --action validate \
            --factory "$TARGET_FACTORY" \
            --gateway "$TARGET_GATEWAY" \
            --project "$TARGET_PROJECT" \
            --sha "$GITHUB_SHA"

  framework-stage-controller:
    name: Manual create-only staging for commissioned Factory A TEST probe
    needs: [validate, framework-validate]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'framework-stage-controller' && github.ref == 'refs/heads/feat/reusable-multifactory-framework-v1'
    runs-on: [self-hosted, linux, ignition-lab]
    environment: ignition-test
    timeout-minutes: 15
    concurrency:
      group: eam-lab-factory_a
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backup and stage approved TEST project, then scan and verify SHA
        env:
          TARGET_FACTORY: ${{ inputs.factory }}
          TARGET_GATEWAY: ${{ inputs.gateway_id }}
          TARGET_PROJECT: ${{ inputs.project_name }}
          FACTORY_A_SMOKE_CONFIRM: 'YES'
          IGNITION_CONTROLLER_CONTAINER: 'ignition-eam-controller'
          IGNITION_AGENT_CONTAINER: 'ignition-eam-agent'
          IGNITION_BACKUP_DIR: ${{ vars.IGNITION_BACKUP_DIR || '/home/tomha/ignition-eam-lab/backups' }}
          IGNITION_CONTROLLER_CA_FILE: ${{ vars.IGNITION_CONTROLLER_CA_FILE || '/home/tomha/ignition-eam-lab/certs/lab-root-ca.crt' }}
          IGNITION_CONTROLLER_API_TOKEN: ${{ secrets.IGNITION_GATEWAY_API_TOKEN }}
          no_proxy: 'localhost,127.0.0.1,::1'
        run: |
          python scripts/manual_factory_dispatch.py --action stage-controller \
            --factory "$TARGET_FACTORY" \
            --gateway "$TARGET_GATEWAY" \
            --project "$TARGET_PROJECT" \
            --sha "$GITHUB_SHA"
      - name: Upload manual Factory A TEST Controller evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-factory-controller-evidence
          path: evidence/factory-a-controller-smoke.json
          if-no-files-found: warn
